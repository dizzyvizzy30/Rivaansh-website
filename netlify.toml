# Netlify build + routing for the Astro site.
# Plan: docs/site-restructure-plan.md · setup notes: docs/domain-and-hosting-setup.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys show unreviewed draft pages (with a "Draft" banner) so the doctor can
# review them on a phone. Production never builds drafts.
[context.deploy-preview.environment]
  SHOW_DRAFTS = "true"

[context.branch-deploy.environment]
  SHOW_DRAFTS = "true"

# ---------------------------------------------------------------------------
# Old URLs → new pages. Each rule exists for both the .html and extensionless path.
# These pages no longer exist in dist/, so Netlify's "shadowing" can't block the rules.
# ---------------------------------------------------------------------------

# Old overview page named a different doctor
[[redirects]]
  from = "/pages/about.html"
  to = "/pages/about-us.html"
  status = 301

[[redirects]]
  from = "/pages/about"
  to = "/pages/about-us.html"
  status = 301

